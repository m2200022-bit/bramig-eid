<style>
  :root{
    /* لوحة مقتبسة من التصميم: أزرق داكن + تركوازي + برتقالي + أخضر */
    --maroon-950:#0E2A47; --maroon-900:#123A5F; --maroon-800:#17497A; --maroon-700:#1E5F96; --maroon-600:#2C7BB6;
    --maroon-100:#DDEAF5; --maroon-50:#F4F9FD; --gold:#F08A24; --gold-d:#D2731A; --red:#D64545;
    --teal:#12A5A0; --teal-d:#0E8683; --green:#1E9E57; --amber:#F2B441;
    --ink:#172436; --line:#DCE7F2; --white:#ffffff;
    --font-body:'DG Trika','Tajawal',sans-serif;
    --font-head:'DG Trika','Tajawal',sans-serif;
    --radius:12px; --shadow:0 1px 2px rgba(138,21,56,.06),0 4px 16px rgba(138,21,56,.08);
  }
  h1,h2,h3,h4{font-family:var(--font-head); color:var(--maroon-800);}
  button{font-family:var(--font-body);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body); font-size:10pt; font-weight:400; line-height:1.65; background:linear-gradient(180deg,#FFFFFF 0%,#F7FBFE 55%,#EFF7FB 100%); background-attachment:fixed; color:var(--ink); min-height:100vh;}
  #app{display:flex; min-height:100vh;}
  #sidebar{width:250px; flex:0 0 250px; background:linear-gradient(180deg,#0E2A47 0%,#124C6B 60%,#12857F 100%); color:var(--white);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{display:flex; align-items:center; gap:10px; padding:20px 16px; border-bottom:1px solid rgba(255,255,255,.12);}
  .brand img{width:42px;height:42px;object-fit:contain;}
  .brand .logo-placeholder{width:42px;height:42px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .brand-name{font-family:var(--font-head);font-weight:700;font-style:italic;font-size:15px;line-height:1.3;}
  .brand-sub{font-size:11px;opacity:.75;margin-top:2px;}
  nav.mainnav{flex:1; padding:14px 10px; display:flex; flex-direction:column; gap:4px; overflow-y:auto;}
  nav.mainnav button{all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-size:14px; font-weight:400; color:rgba(255,255,255,.88); transition:background .15s;}
  nav.mainnav button .ic{font-size:17px; width:20px; text-align:center;}
  nav.mainnav button:hover{background:rgba(255,255,255,.08);}
  nav.mainnav button.active{background:var(--gold); color:#fff; font-weight:700;}
  .sidebar-foot{padding:14px; font-size:11px; opacity:.85; border-top:1px solid rgba(255,255,255,.12); display:flex; flex-direction:column; gap:8px;}
  .sidebar-foot button{all:unset; cursor:pointer; background:rgba(255,255,255,.12); color:#fff; padding:7px 10px; border-radius:6px; font-size:12px; text-align:center;}
  .sidebar-foot button:hover{background:rgba(255,255,255,.22);}
  #main{flex:1; display:flex; flex-direction:column; min-width:0;}
  header.topbar{background:var(--white); border-bottom:2px solid var(--maroon-800); padding:16px 26px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5; box-shadow:var(--shadow);}
  header.topbar h1{font-family:var(--font-head); font-style:italic; font-weight:700; color:var(--maroon-800); font-size:21px; margin:0;}
  header.topbar .sub{font-size:12.5px;color:#7a5560;margin-top:3px;}
  .content{padding:24px 26px 60px; flex:1;}
  .grid > .card{height:100%;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:0 14px 14px; margin-bottom:14px; overflow:hidden;}
  .card h2{font-family:var(--font-head); font-weight:700; color:#fff; background:var(--maroon-800); font-size:14px; margin:0 -14px 12px -14px; padding:10px 14px; border-radius:0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:none;}
  .form-table{width:100%; border-collapse:collapse; margin:0 -14px; width:calc(100% + 28px);}
  .form-table thead th{background:linear-gradient(90deg,#8A1538,#A32348); color:#fff; font-family:var(--font-body); font-weight:700; font-size:14px; padding:9px 14px; text-align:right;}
  .form-table tbody td{border:1px solid #EBD3DB; padding:8px 10px; vertical-align:top;}
  .form-table tbody td label{display:block; font-size:14px; font-weight:700; color:#8A1538; margin-bottom:4px;}
  .form-table input, .form-table select, .form-table textarea{font-size:14px; font-weight:400; color:#8A1538; border-color:#E3C4CE;}
  .form-table input:focus, .form-table select:focus, .form-table textarea:focus{border-color:#8A1538; box-shadow:0 0 0 3px rgba(138,21,56,.12);}
  .form-table .checkbox-chip, .form-table .presenter-chip{font-size:14px; color:#8A1538;}
  .form-table .helper{font-size:12px; font-weight:400; color:#A3697C;}
  .form-table.compact tbody td{padding:4px 6px; white-space:nowrap;}
  .form-table.compact tbody td label{font-size:14px; margin-bottom:2px;}
  .form-table .auto-w{width:auto; min-width:0; max-width:100%;}
  .form-table .auto-w.num{width:84px;}
  /* ===== بوابة الدخول: حدود ذهبية مضيئة وخلفية زرقاء فاتحة ===== */
  .gate-card.gate-login{background:#EAF3FC !important; border:2px solid #D4AF37 !important;
    box-shadow:0 0 0 3px rgba(212,175,55,.25), 0 0 22px 4px rgba(212,175,55,.45) !important;}
  .gate-card.gate-login h1{color:var(--maroon-800);}

  /* ===== مربع معلومات المستخدم وحالة المزامنة ===== */
  .userbox{margin:10px 6px 4px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18);
    border-radius:9px; overflow:hidden; font-size:11.5px;}
  .userbox .row{display:flex; justify-content:space-between; gap:8px; padding:5px 9px; color:#fff;
    border-bottom:1px solid rgba(255,255,255,.12);}
  .userbox .row:last-child{border-bottom:none;}
  .userbox .k{opacity:.75;}
  .userbox .v{font-weight:700;}
  .sync-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-inline-end:5px; vertical-align:middle;}
  .sync-ok{background:#35C46A; box-shadow:0 0 6px #35C46A;}
  .sync-bad{background:#E5484D; box-shadow:0 0 6px #E5484D;}

  /* ===== انطواء القائمة الجانبية ===== */
  #sidebar{transition:width .18s ease, flex-basis .18s ease;}
  body.nav-collapsed #sidebar{width:64px; flex:0 0 64px;}
  body.nav-collapsed #sidebar .nav-text,
  body.nav-collapsed #sidebar .userbox,
  body.nav-collapsed #sidebar .brand-text{display:none;}
  body.nav-collapsed nav.mainnav button{justify-content:center; padding:10px 0;}
  #navToggle{all:unset; cursor:pointer; display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.12); color:#fff; font-size:15px;}
  #navToggle:hover{background:rgba(255,255,255,.22);}
  nav.mainnav button{position:relative;}
  body.nav-collapsed nav.mainnav button::after{content:attr(data-label); position:absolute; right:calc(100% + 8px);
    top:50%; transform:translateY(-50%); background:#222; color:#fff; padding:4px 9px; border-radius:6px;
    font-size:12px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:50;}
  body.nav-collapsed nav.mainnav button:hover::after{opacity:1;}

let saving=false, pendingSave=false;
/* ══════════════════════════════════════════════════════════════════
   الحفظ مع تجميع الطلبات (Debounce) — تحسين أداء
   ──────────────────────────────────────────────────────────────────
   كان كل تعديل صغير يُنفّذ JSON.stringify لكامل البيانات + كتابة شبكية
   كاملة، فيبطؤ النظام مع كثرة السجلات. الآن تُجمَّع التعديلات المتتابعة
   في كتابة واحدة بعد 600ms، مع ضمان الحفظ عند إغلاق الصفحة.
   ══════════════════════════════════════════════════════════════════ */
let __saveTimer = null;
function saveState(){
  return new Promise(resolve=>{
    if(__saveTimer) clearTimeout(__saveTimer);
    __saveTimer = setTimeout(()=>{ __saveTimer=null; flushSave().then(resolve); }, 600);
  });
}
async function flushSave(){
  if(saving){ pendingSave=true; return; }
  saving=true;
  try{
    await STATE_DOC().set({ json: JSON.stringify(state), updatedAt: Date.now() });
    syncState.ok = true; syncState.lastAt = Date.now(); renderUserBox();
  }catch(e){
    console.error('save error', e);
    syncState.ok = false; renderUserBox();
    // إظهار الخطأ بوضوح بدل الفشل الصامت الذي كان يسبب فقدان البيانات
    toast('⚠️ لم يتم حفظ البيانات! ' + (e && e.message ? e.message : ''));
  }
  saving=false;
  if(pendingSave){ pendingSave=false; flushSave(); }
}

/* ============ Scheduling conflict helpers ============ */
function parseDT(dateStr, timeStr){ if(!dateStr) return null; return new Date(dateStr+'T'+(timeStr||'00:00')+':00'); }
function dateRangesOverlap(aFrom, aTo, bFrom, bTo){
  return aFrom <= (bTo||aFrom) && (aTo||aFrom) >= bFrom;
}
function trainerConflictSingle(trainerId, date, timeFrom, timeTo, excludeOrderId, dateTo){
  if(!trainerId || !date) return null;
  const dTo = dateTo || date;
  const bufferMs = 90*60*1000;
  // نقارن وقت اليوم فقط (بغض النظر عن التاريخ الفعلي) باستخدام يوم مرجعي ثابت،
  // لأن الفعالية متعددة الأيام تتكرر بنفس الفترة الزمنية كل يوم ضمن مدتها
  const refDay = '2000-01-01';
  const newStart = parseDT(refDay, timeFrom||'00:00'), newEnd = parseDT(refDay, timeTo||timeFrom||'23:59');
  return state.orders.find(o=>{
    if(o.id===excludeOrderId) return false;
    if(!(o.trainerIds||[]).includes(trainerId)) return false;
    const oTo = o.dateTo || o.date;
    if(!dateRangesOverlap(date, dTo, o.date, oTo)) return false;
    const exStart = parseDT(refDay, o.timeFrom||'00:00'), exEnd = parseDT(refDay, o.timeTo||o.timeFrom||'23:59');
    const winStart = new Date(exStart.getTime()-bufferMs), winEnd = new Date(exEnd.getTime()+bufferMs);
    return newStart < winEnd && newEnd > winStart;
  }) || null;
}
function anyTrainerConflict(trainerIds, date, timeFrom, timeTo, excludeOrderId, dateTo){
  for(const tId of (trainerIds||[])){
    const c = trainerConflictSingle(tId, date, timeFrom, timeTo, excludeOrderId, dateTo);
    if(c) return {trainerId:tId, order:c};
  }
  return null;
}
function schoolSameDay(schoolId, date, excludeOrderId){
  if(!schoolId||!date) return null;
  return state.orders.find(o=> o.id!==excludeOrderId && o.schoolId===schoolId && o.date===date) || null;
}

  } else {
    upcomingList = state.orders.filter(o=>{ const d=daysDiffSafe(today,o.date); return d!==null && d>=0 && d<=2; });
    notifList = state.adminNotifications.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);
    notifKind='admin';
  }
  const unreadCount = notifList.filter(n=>!n.read).length;
  const wrap = document.createElement('div');
  wrap.className='bell-wrap';
  wrap.innerHTML = `<button class="bell-btn" id="bellBtn">🔔${unreadCount?'<span class="dot"></span>':''}</button>
    <div class="bell-pnl" id="bellPnl">
      ${upcomingList.length?`<div style="font-weight:700;color:var(--maroon-800);padding:8px 10px;">فعاليات قريبة (خلال يومين)</div>${upcomingList.map(o=>`<div class="bell-item">📅 ${escapeHtml(o.title)} — ${o.date} ${o.timeFrom||''}</div>`).join('')}`:''}

      ${notifList.length?notifList.map(n=>`<div class="bell-item" style="${n.read?'':'background:var(--maroon-50);'}">${escapeHtml(n.message)}</div>`).join(''):'<div class="bell-item" style="color:#999;">لا توجد إشعارات</div>'}
    </div>`;
  document.getElementById('topbarActions').appendChild(wrap);
  document.getElementById('bellBtn').onclick=async (e)=>{
    e.stopPropagation();
    document.getElementById('bellPnl').classList.toggle('open');
    if(notifKind==='admin'){ state.adminNotifications.forEach(n=>n.read=true); }
    else { state.notifications.filter(n=>n.trainerId===loggedTrainerId).forEach(n=>n.read=true); }
    await saveState();
  };
  document.addEventListener('click', function closeBell(ev){ const pnl=document.getElementById('bellPnl'); if(pnl && !wrap.contains(ev.target)){ pnl.classList.remove('open'); } }, {once:true});
}

/* ══════════════════════════════════════════════════════════════════
   توضيح التاريخ تحت كل حقل تاريخ
   ──────────────────────────────────────────────────────────────────
   حقل <input type="date"> يعرض ترتيب اليوم/الشهر حسب لغة المتصفح،
   وقد يظهر mm/dd/yyyy في بعض الأجهزة مما يوهم أن الشهر هو اليوم.
   القيمة المخزَّنة دائمًا صحيحة (YYYY-MM-DD)، لذا نعرض تحت كل حقل
   نصًا صريحًا بالعربية لا يحتمل اللبس، مثل: 6 أغسطس 2026 (06/08/2026)
   ══════════════════════════════════════════════════════════════════ */
function dateInWords(iso){
  if(!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  const names=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const day=parseInt(m[3],10), mon=names[parseInt(m[2],10)-1]||m[2], yr=m[1];
  return `${day} ${mon} ${yr} (${m[3]}/${m[2]}/${m[1]})`;
}
function attachDateHints(){
  document.querySelectorAll('input[type="date"]').forEach(inp=>{
    if(inp.closest('td') && inp.classList.contains('qs-field')) return; // جدول التعديل السريع: مساحته ضيقة
    let hint = inp.nextElementSibling;
    if(!hint || !hint.classList || !hint.classList.contains('date-hint')){
      hint = document.createElement('div');
      hint.className = 'date-hint';
      inp.insertAdjacentElement('afterend', hint);
    }
    const upd = ()=>{ hint.textContent = inp.value ? dateInWords(inp.value) : ''; };
    if(!inp.dataset.hintBound){ inp.addEventListener('input', upd); inp.addEventListener('change', upd); inp.dataset.hintBound='1'; }
    upd();
  });
}

/* ============ Order tables ============ */
/* Enhances a report table: wraps it for horizontal scroll, adds a toolbar with
   "reset column widths" and "toggle text wrap", and makes each column's border
   draggable to resize manually. Auto-fit-to-content is the browser default
   (table-layout:auto) and is restored any time "reset" is pressed or the table
   is re-rendered (e.g. after filtering/searching), since a fresh render has no
   inline widths. Call this once, right after inserting a <table> into `container`. */
function enhanceReportTable(container){
  if(!container) return;
  const tables = container.querySelectorAll('table');
  if(!tables.length) return;

  if(!container.querySelector('.tbl-enhance-toolbar')){
    const toolbar = document.createElement('div');
    toolbar.className = 'tbl-enhance-toolbar';
    toolbar.innerHTML = `<button class="icon-btn rect" type="button">↺ إعادة ضبط عرض الأعمدة</button>
      <button class="icon-btn rect" type="button">↔️ عرض مضغوط (بدون التفاف)</button>`;
    tables[0].parentNode.insertBefore(toolbar, tables[0]);
    const [resetBtn, wrapBtn] = toolbar.querySelectorAll('button');
    resetBtn.onclick = ()=>{ container.querySelectorAll('th').forEach(th=>{ th.style.width=''; }); };
    wrapBtn.onclick = ()=>{ container.querySelectorAll('.tbl-scroll').forEach(w=>w.classList.toggle('tbl-nowrap')); };
  }

  tables.forEach(table=>{
    if(!table.parentElement.classList.contains('tbl-scroll')){
      const scrollWrap = document.createElement('div');
      scrollWrap.className = 'tbl-scroll';
      table.parentNode.insertBefore(scrollWrap, table);
      scrollWrap.appendChild(table);
    }
    table.querySelectorAll('th').forEach(th=>{
      if(th.querySelector('.col-resizer')) return;
      const handle = document.createElement('span');
      handle.className = 'col-resizer';
      th.appendChild(handle);
      handle.addEventListener('mousedown', (e)=>{
        e.preventDefault(); e.stopPropagation();
        handle.classList.add('active');
        const startX = e.clientX, startWidth = th.offsetWidth;
        function onMove(ev){
          const delta = startX - ev.clientX; // RTL: dragging the left edge left increases width
          th.style.width = Math.max(40, startWidth + delta) + 'px';
        }
        function onUp(){
          handle.classList.remove('active');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  });
}
let __orderTableSelections = {};
function otblSelectAll(containerId, headerCheckbox){
  const container = document.getElementById(containerId);
  const rowChecks = container.querySelectorAll('.otbl-check');
  rowChecks.forEach(cb=>{ cb.checked = headerCheckbox.checked; });
  if(!__orderTableSelections[containerId]) __orderTableSelections[containerId] = new Set();
  const set = __orderTableSelections[containerId];
  set.clear();
  if(headerCheckbox.checked){ rowChecks.forEach(cb=>set.add(cb.dataset.id)); }
  const toolbar = document.getElementById(containerId+'_toolbar');
  if(toolbar){
    toolbar.querySelectorAll('.single-only').forEach(b=>{ b.disabled = set.size!==1; });
    toolbar.querySelectorAll('button.multi-ok').forEach(b=>{ b.disabled = set.size<1; });
    const select = toolbar.querySelector('.bulk-status-select');
    if(select) select.disabled = set.size<1;
  }
}
function otblSelect(containerId, checkbox){
  if(!__orderTableSelections[containerId]) __orderTableSelections[containerId] = new Set();
  const set = __orderTableSelections[containerId];
  if(checkbox.checked) set.add(checkbox.dataset.id); else set.delete(checkbox.dataset.id);
  const container = document.getElementById(containerId);
  const allChecks = container.querySelectorAll('.otbl-check');
  const headerCheckbox = container.querySelector('.otbl-check-all');
  if(headerCheckbox) headerCheckbox.checked = allChecks.length>0 && Array.from(allChecks).every(cb=>cb.checked);
  const toolbar = document.getElementById(containerId+'_toolbar');
  if(toolbar){
    toolbar.querySelectorAll('.single-only').forEach(b=>{ b.disabled = set.size!==1; });
    toolbar.querySelectorAll('button.multi-ok').forEach(b=>{ b.disabled = set.size<1; });
    const select = toolbar.querySelector('.bulk-status-select');
    if(select) select.disabled = set.size<1;
  }
}

/* ============ Order Page (طلبات الفعاليات والمبادرات) ============ */
function getWeekBounds(d){
  const dt = new Date(d+'T00:00:00');
  const dow = dt.getDay(); // 0=Sun
  const start = new Date(dt); start.setDate(dt.getDate()-dow);
  const end = new Date(start); end.setDate(start.getDate()+6);
  const fmt=(x)=>x.toISOString().slice(0,10);
  return {start:fmt(start), end:fmt(end)};
}

      if(kind==='status') return [{v:'active',l:'نشطة'},{v:'cancelled',l:'ملغاة'},{v:'postponed',l:'مؤجّلة'}];
      return [];
    }
    document.getElementById('ord_filterKind').addEventListener('change', e=>{
      const kind=e.target.value, wrap=document.getElementById('ord_filterValWrap'), sel=document.getElementById('ord_filterVal');

      sel.innerHTML = '<option value="">الكل</option>' + optionsForKind(kind).map(o=>`<option value="${escapeHtml(o.v)}">${escapeHtml(o.l)}</option>`).join('');
      wrap.style.display=''; drawFiltered();
    });
    document.getElementById('ord_filterVal').addEventListener('change', ()=>drawFiltered());
    document.getElementById('ord_clearFilter').onclick=()=>{
      document.getElementById('ord_filterKind').value='';
      document.getElementById('ord_filterValWrap').style.display='none';
      document.getElementById('ord_filterVal').innerHTML='';
      document.getElementById('ord_serialSearch').value='';
      document.getElementById('ord_schoolSearch').value='';
      drawFiltered();
    };
    function drawFiltered(){
      const serialQ = document.getElementById('ord_serialSearch').value.trim();
      const q = document.getElementById('ord_schoolSearch').value.trim();
      const kind = document.getElementById('ord_filterKind').value;
      const val  = document.getElementById('ord_filterVal').value || '';
      const trainerFilter    = kind==='trainer' ? val : '';
      const fieldFilter      = kind==='field' ? val : '';
      const pathFilter       = kind==='path' ? val : '';
      const completionFilter = kind==='completion' ? val : '';
      const statusFilter     = kind==='status' ? val : '';
      // الأحدث أولًا: حسب وقت الإنشاء ثم التاريخ ثم رقم التكليف
      // (الترتيب برقم التكليف وحده غير كافٍ لأن الترقيم يُعاد من 1 كل سنة)
      let list = state.orders.slice().sort((a,b)=>
        (b.createdAt||0)-(a.createdAt||0) ||
        (b.date||'').localeCompare(a.date||'') ||
        (b.serial||0)-(a.serial||0)
      );
      if(serialQ){ list = list.filter(o=>String(o.serial).includes(serialQ)); }
      if(q){ list = list.filter(o=>{ const s=state.schools.find(x=>x.id===o.schoolId); return s && s.name.includes(q); }); }
      if(trainerFilter){ list = list.filter(o=>(o.trainerIds||[]).includes(trainerFilter)); }
      if(fieldFilter){ list = list.filter(o=>o.fieldId===fieldFilter); }
      if(pathFilter){ list = list.filter(o=>o.programTypeId===pathFilter); }
      if(completionFilter){

      }
      if(statusFilter){ list = list.filter(o=>(o.status||'active')===statusFilter); }
      const box = document.getElementById('ord_listResult');
      box.innerHTML = ordersTableHtml(list, 'otbl_order_list');
      enhanceReportTable(box);
    }
    ['ord_serialSearch','ord_schoolSearch'].forEach(id=>document.getElementById(id).addEventListener('input', drawFiltered));
    drawFiltered();
    return;
  }
  renderOrderForm(sub);
}

      let sch = state.schools.find(s=>s.name===r.schoolName);
      // منع التكرار: نفس العنوان والتاريخ والمدرسة
      if(state.orders.some(o=>normT(o.title)===normT(r.title) && o.date===r.date && sch && o.schoolId===sch.id)){ skipped++; return; }
      if(!sch && r.schoolName){ sch={id:uid(), name:r.schoolName, level:'غير ذلك', email:'', supervisors:[]}; state.schools.push(sch); }

      let programTypeId = state.programTypes[0]?state.programTypes[0].id:'';
      if(r.ptypeName){
        let pt = state.programTypes.find(p=>p.name===r.ptypeName);
        if(!pt){ pt={id:uid(), name:r.ptypeName}; state.programTypes.push(pt); }
        programTypeId = pt.id;
      }
      const trainerIds = [];
      if(r.trainersRaw){
        r.trainersRaw.split(/[،,]/).map(s=>s.trim()).filter(Boolean).forEach(entry=>{
          const [nm, ph] = entry.split(':').map(s=>s?s.trim():'');
          const name = nm||entry;
          let tr = state.trainers.find(t=> (ph && t.phone===ph) || t.name===name);
          if(!tr){ tr={id:uid(), name, phone:ph||''}; state.trainers.push(tr); }
          trainerIds.push(tr.id);
        });
      }
      let supervisorId='';
      if(sch && (r.supName || r.supPhone)){
        let sv = sch.supervisors.find(x=>(r.supPhone && x.phone===r.supPhone) || (r.supName && x.name===r.supName));
        if(!sv){ sv={id:uid(), name:r.supName||'مشرف (بدون اسم)', phone:r.supPhone, email:''}; sch.supervisors.push(sv); }
        supervisorId = sv.id;
      }
      const yr = (r.date || todayStr()).slice(0,4);
      const maxSerial = state.orders.filter(o=>o.date && o.date.slice(0,4)===yr).reduce((m,o)=>Math.max(m,o.serial||0),0);
      state.orders.push({
        id:uid(), serial:maxSerial+1, createdAt:Date.now(), title:r.title,
        fieldId: state.fields[0]?state.fields[0].id:'', participantsCount:r.participantsCount,
        date:r.date, dateTo:r.date, timeFrom:r.timeFrom, timeTo:r.timeTo, programTypeId,
        schoolId: sch?sch.id:'', supervisorId, trainerIds, requesterNote:'', adminNote:'مُدخل باللصق',
        adminRequests:[], completionStatus: markDone?'تم':'', notDoneReason:'', supervisorRating:0,
        schoolRating:0, studentsRating:0, recommendSchool:'', evaluatedBy:'', status:'active'
      });
      added++;
    });
    await saveState();
    toast(`تمت إضافة ${added} فعالية${skipped?` — تم تجاهل ${skipped} مكررة`:''}`);
    document.getElementById('qs_paste').value=''; document.getElementById('qs_pastePreview').innerHTML='';
    pastedRows=[]; document.getElementById('qs_pasteApply').disabled=true;
    draw();
  };

  };
  document.getElementById('qs_bulkApplyPath').onclick = async ()=>{

    if(!ok) return;
    selectedIds.forEach(id=>{ const o=state.orders.find(x=>x.id===id); if(o) o.programTypeId=pathId; });

    const placeF = document.getElementById('qs_placeFilter').value;
    const levelF = document.getElementById('qs_levelFilter').value;
    const emptyCol = document.getElementById('qs_emptyFilter').value;
    let list = state.orders.slice().sort((a,b)=>b.serial-a.serial);
    if(serialQ){ list = list.filter(o=>String(o.serial).includes(serialQ)); }
    if(q){
      list = list.filter(o=>{
        const s = state.schools.find(x=>x.id===o.schoolId);
        return o.title.includes(q) || (s && s.name.includes(q));
      });
    }
    if(fF){ list = list.filter(o=>o.fieldId===fF); }
    if(pF){ list = list.filter(o=>o.programTypeId===pF); }
    if(placeF){ list = list.filter(o=>{ const s=state.schools.find(x=>x.id===o.schoolId); return s && placeTypeLabel(s.level)===placeF; }); }
    if(levelF){ list = list.filter(o=>{ const s=state.schools.find(x=>x.id===o.schoolId); return s && s.level===levelF; }); }
    // بحث حسب الفراغ: يعرض الصفوف التي يكون فيها العمود المختار فارغًا

        const sch = state.schools.find(x=>x.id===o.schoolId);
        const sup = sch ? sch.supervisors.find(s=>s.id===o.supervisorId) : null;
        switch(emptyCol){
          case 'fieldId': return !o.fieldId;
          case 'programTypeId': return !o.programTypeId;
          case 'date': return !o.date;
          case 'dateTo': return !o.dateTo;
          case 'timeFrom': return !o.timeFrom;
          case 'timeTo': return !o.timeTo;
          case 'participantsCount': return !o.participantsCount;
          case 'title': return !o.title;
          case 'placeType': return !sch || !sch.level;
          case 'schoolId': return !o.schoolId;
          case 'supervisorId': return !o.supervisorId;
          case 'supPhone': return !sup || !sup.phone;
          case 'trainerIds': return !(o.trainerIds||[]).length;
          default: return true;
        }
      });

    const wrap = document.getElementById('qs_tableWrap');
    wrap.innerHTML = `<table><thead><tr>
        <th><input type="checkbox" id="qs_selectAll" title="تحديد الكل"></th>
        <th>رقم أمر التكليف</th>
        <th style="min-width:150px;">مجال المبادرة</th>
        <th style="min-width:150px;">مسار المبادرة</th>
        <th>تاريخ المبادرة من</th>
        <th>تاريخ الانتهاء</th>
        <th>وقت المبادرة من</th>
        <th>وقت المبادرة إلى</th>
        <th>عدد المستهدفين</th>
        <th style="min-width:220px;">عنوان المبادرة</th>
        <th style="min-width:130px;">مكان التنفيذ</th>
        <th style="min-width:180px;">مكان المبادرة</th>
        <th style="min-width:120px;">المرحلة</th>
        <th style="min-width:150px;">المشرف</th>
        <th style="min-width:120px;">رقم الجوال</th>
        <th style="min-width:200px;">بيانات المدربين وهواتفهم</th>
        <th>الإنجاز</th>
        <th>إجراءات</th>
      </tr></thead><tbody>
        ${list.map(o=>{
          const sch = state.schools.find(x=>x.id===o.schoolId);
          const sup = sch ? sch.supervisors.find(s=>s.id===o.supervisorId) : null;
          const trainersTxt = (o.trainerIds||[]).map(id=>{ const t=state.trainers.find(x=>x.id===id); return t?`${t.name}:${t.phone||''}`:''; }).filter(Boolean).join('، ');
          return `<tr data-order-id="${o.id}" style="${o.status==='cancelled'?'opacity:.55;':''}">
          <td><input type="checkbox" class="qs-check" data-id="${o.id}" ${selectedIds.has(o.id)?'checked':''}></td>

          <td><select class="qs-field" data-field="fieldId">
            <option value="">—</option>
            ${state.fields.map(f=>`<option value="${f.id}" ${o.fieldId===f.id?'selected':''}>${escapeHtml(f.name)}</option>`).join('')}
          </select></td>
          <td><select class="qs-field" data-field="programTypeId">
            <option value="">—</option>
            ${state.programTypes.map(p=>`<option value="${p.id}" ${o.programTypeId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}

      });
    });
    wrap.querySelectorAll('.qs-place').forEach(el=>{
      el.addEventListener('change', async ()=>{

        const o = state.orders.find(x=>x.id===tr.dataset.orderId); if(!o) return;

      });
    });

    if(selectAll){
      selectAll.addEventListener('change', ()=>{
        wrap.querySelectorAll('.qs-check').forEach(cb=>{
          cb.checked = selectAll.checked;
          if(selectAll.checked) selectedIds.add(cb.dataset.id); else selectedIds.delete(cb.dataset.id);
        });
        updateBulkToolbar();
      });
    }
    updateBulkToolbar();
  }
  ['qs_search','qs_serial'].forEach(id=>document.getElementById(id).addEventListener('input', draw));
  ['qs_fFilter','qs_pFilter','qs_placeFilter','qs_levelFilter','qs_emptyFilter'].forEach(id=>document.getElementById(id).addEventListener('change', draw));
  draw();
}

  function refreshTrainerChips(){
    const date = currentDate(), dateTo = currentDateTo(), tf=currentTimeFrom(), tt=currentTimeTo();
    const box = document.getElementById('trainerChipList');
    const previouslyChecked = Array.from(box.querySelectorAll('input:checked')).map(i=>i.value);
    const checkedSet = new Set(previouslyChecked.length ? previouslyChecked : selectedTrainerIds);
    box.innerHTML = state.trainers.map(t=>{
      const conflict = date ? trainerConflictSingle(t.id, date, tf, tt, editing?editing.id:null, dateTo) : null;
      const busy = !!conflict && !checkedSet.has(t.id);
      const checked = checkedSet.has(t.id);
      // المشغول لم يعد ممنوعًا: يُسمح باختياره بعد تأكيد التنسيق مع الجهة
      const tip = busy ? `مشغول: ${conflict.title||''} ${conflict.date||''} ${conflict.timeFrom||''}` : '';
      return `<label class="presenter-chip${busy?' is-busy':''}" title="${escapeHtml(tip)}">
        <input type="checkbox" value="${t.id}" data-busy="${busy?'1':'0'}" data-conflict="${busy?escapeHtml((conflict.title||'')+' — '+fmtDate(conflict.date)+' '+(conflict.timeFrom||'')):''}" ${checked?'checked':''}> ${escapeHtml(t.name)}${busy?' <span style="color:#C0392B;font-size:11px;">(مشغول)</span>':''}
      </label>`;
    }).join('') || '<span class="helper">لا يوجد مقدمو مبادرات بعد</span>';
    // تأكيد صريح عند اختيار مدرب مشغول
    box.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked && cb.dataset.busy==='1'){
          const ok = confirm(`هذا المقدّم مرتبط بفعالية أخرى في نفس الفترة:\n${cb.dataset.conflict}\n\nهل تم التنسيق مع الجهة لإسناده لهذه الفعالية أيضًا؟`);
          if(!ok){ cb.checked=false; return; }
          toast('تم إسناد مقدّم مشغول — تأكد من التنسيق مع الجهة');
        }
      });
    });
  }

  function recalcDurations(){
    const dEl = document.getElementById('f_date'), dToEl = document.getElementById('f_dateTo');
    // فعالية ليوم واحد: يُعبّأ تاريخ الانتهاء تلقائيًا بنفس تاريخ البداية
    if(dEl.value && !dToEl.value) dToEl.value = dEl.value;
    // حماية: تاريخ انتهاء أسبق من البداية يُعاد لتاريخ البداية
    if(dEl.value && dToEl.value && dToEl.value < dEl.value) dToEl.value = dEl.value;
    document.getElementById('f_daysCount').value = dEl.value ? daysCount(dEl.value, dToEl.value) : '';
    document.getElementById('f_hoursCount').value = hoursDuration(document.getElementById('f_timeFrom').value, document.getElementById('f_timeTo').value, dEl.value, dToEl.value);
  }
  ['f_date','f_dateTo','f_timeFrom','f_timeTo'].forEach(id=>document.getElementById(id).addEventListener('input', recalcDurations));

      document.getElementById('f_timeTo').value = `${hh}:${mm}`;

  });

      const matchesText = !q || opt.textContent.includes(q);
      const matchesLevel = !levels.length || levels.includes(opt.dataset.level);
      opt.style.display = (matchesText && matchesLevel) ? '' : 'none';
    });

  function renderReqChips(){

    function selectedTagsHtml(){
      const tags = Array.from(selectedReqIds).map(id=>{
        const r = state.adminRequestsList.find(x=>x.id===id);
        return r ? `<span class="checkbox-chip" style="display:inline-flex;align-items:center;gap:6px;">${escapeHtml(r.name)} <a href="#" data-remove-id="${id}" style="color:var(--maroon-800);font-weight:700;text-decoration:none;">✕</a></span>` : '';

    reqBox.innerHTML = `

          ${categories.map(cat=>{

                ${items.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')}
              </select>
              <label class="checkbox-chip req-cat-check" data-cat="${cat}" style="display:none;"><input type="checkbox"> إضافة للطلب</label>
            </td>`;
          }).join('')}
        </tr></tbody>
      </table>
      <div class="helper" style="margin-bottom:4px;">البنود المختارة:</div>
      <div id="reqSelectedTags" style="display:flex;flex-wrap:wrap;gap:8px;">${selectedTagsHtml()}</div>
      <div id="reqHiddenChecks" style="display:none;">${state.adminRequestsList.map(r=>`<input type="checkbox" value="${r.id}" ${selectedReqIds.has(r.id)?'checked':''}>`).join('')}</div>
    `;
    function syncHiddenChecks(){
      reqBox.querySelectorAll('#reqHiddenChecks input[type=checkbox]').forEach(cb=>{ cb.checked = selectedReqIds.has(cb.value); });
      document.getElementById('reqSelectedTags').innerHTML = selectedTagsHtml();
      document.getElementById('reqSelectedTags').querySelectorAll('a[data-remove-id]').forEach(a=>{
        a.addEventListener('click', (e)=>{ e.preventDefault(); selectedReqIds.delete(a.dataset.removeId); syncHiddenChecks(); refreshCategoryCheckState(); });
      });
    }
    function refreshCategoryCheckState(){
      reqBox.querySelectorAll('.req-cat-select').forEach(sel=>{
        const wrap = reqBox.querySelector(`.req-cat-check[data-cat="${sel.dataset.cat}"]`);
        const cb = wrap.querySelector('input');
        if(sel.value){
          wrap.style.display = 'inline-flex';
          cb.checked = selectedReqIds.has(sel.value);
        } else {
          wrap.style.display = 'none';
        }
      });
    }
    reqBox.querySelectorAll('.req-cat-select').forEach(sel=>{
      sel.addEventListener('change', refreshCategoryCheckState);
    });
    reqBox.querySelectorAll('.req-cat-check input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const wrap = cb.closest('.req-cat-check');
        const sel = reqBox.querySelector(`.req-cat-select[data-cat="${wrap.dataset.cat}"]`);
        const id = sel.value; if(!id) return;
        if(cb.checked){
          const date = currentDate();
          if(date){
            const conflictOrder = state.orders.find(o=> (!editing || o.id!==editing.id) && o.date===date && (o.adminRequests||[]).includes(id));
            if(conflictOrder){
              const ok = confirm(`تنبيه: هذا الطلب الإداري "${state.adminRequestsList.find(r=>r.id===id)?.name||''}" مطلوب مسبقًا لبرنامج آخر (${conflictOrder.title}) في نفس التاريخ. قد يكون هناك تداخل. هل تريد المواصلة؟`);
              if(!ok){ cb.checked=false; return; }

          }
          selectedReqIds.add(id);

        syncHiddenChecks();
      });

  async function doSaveOrder(printMode){
    const title=document.getElementById('f_title').value.trim();
    const date=document.getElementById('f_date').value, dateTo=document.getElementById('f_dateTo').value, timeFrom=document.getElementById('f_timeFrom').value, timeTo=document.getElementById('f_timeTo').value;
    const schoolId=document.getElementById('f_school').value;
    const supervisorId=document.getElementById('f_supervisor').value;
    const fieldId=document.getElementById('f_field').value, ptypeId=document.getElementById('f_ptype').value;
    const participantsCount=document.getElementById('f_count').value;
    const trainerIds = Array.from(document.getElementById('trainerChipList').querySelectorAll('input:checked')).map(i=>i.value);
    const checkedReqs = Array.from(reqBox.querySelectorAll('#reqHiddenChecks input:checked')).map(i=>i.value);

    // التحقق من الحقول الإجبارية في كل الأقسام
    if(!fieldId){ toast('يرجى اختيار مجال المبادرة'); return; }
    if(!ptypeId){ toast('يرجى اختيار مسار المبادرة'); return; }
    if(!title){ toast('يرجى إدخال عنوان المبادرة'); return; }
    if(!date){ toast('يرجى إدخال تاريخ المبادرة'); return; }
    if(!dateTo){ toast('يرجى إدخال تاريخ الانتهاء'); return; }
    if(!timeFrom){ toast('يرجى إدخال وقت المبادرة (من)'); return; }
    if(!timeTo){ toast('يرجى إدخال وقت المبادرة (إلى)'); return; }
    if(participantsCount===''){ toast('يرجى إدخال عدد المستهدفين'); return; }
    if(!schoolId){ toast('يرجى اختيار مكان المبادرة'); return; }
    if(!supervisorId){ toast('يرجى اختيار المشرف'); return; }
    if(!trainerIds.length){ toast('يرجى اختيار مقدم مبادرة واحد على الأقل'); return; }
    if(!checkedReqs.length){ toast('يرجى اختيار طلب إداري واحد على الأقل'); return; }

    if(trainerIds.length && date){
      const conflict = anyTrainerConflict(trainerIds, date, timeFrom, timeTo, editing?editing.id:null, dateTo);
      if(conflict){
        const t = state.trainers.find(x=>x.id===conflict.trainerId);
        const ok = confirm(`تنبيه: "${t?t.name:'أحد المقدّمين'}" لديه فعالية أخرى بنفس الفترة:\n${conflict.order.title} — ${fmtDate(conflict.order.date)}\n\nهل تم التنسيق مع الجهة وتريد المتابعة؟`);
        if(!ok) return;
      }
    }
    if(schoolId && date){
      const schConf = schoolSameDay(schoolId, date, editing?editing.id:null);
      if(schConf){
        const ok = confirm(`تنبيه: توجد فعالية أخرى مجدولة في نفس المدرسة بنفس التاريخ (رقم ${schConf.serial} - ${schConf.title}). هل ترغب بالمتابعة؟`);
        if(!ok) return;
      }
    }
    const orderData = {
      title, fieldId, participantsCount,
      date, dateTo: dateTo||'', timeFrom, timeTo, programTypeId: ptypeId,
      schoolId, supervisorId, trainerIds,
      requesterNote: document.getElementById('f_reqNote').value, adminNote: document.getElementById('f_adminNote').value,
      adminRequests: checkedReqs,
    };
    if(editing){ Object.assign(editing, orderData); }
    else {
      orderData.id = uid(); orderData.createdAt = Date.now();
      const orderYear = (date || todayStr()).slice(0,4);
      const yearOrders = state.orders.filter(o=>o.date && o.date.slice(0,4)===orderYear);
      const maxSerialThisYear = yearOrders.reduce((m,o)=>Math.max(m,o.serial||0),0);
      orderData.serial = maxSerialThisYear + 1;
      orderData.completionStatus=''; orderData.notDoneReason=''; orderData.supervisorRating=0; orderData.schoolRating=0; orderData.studentsRating=0; orderData.recommendSchool=''; orderData.evaluatedBy=''; orderData.status='active';
      state.orders.push(orderData);
    }
    await saveState();
    toast(editing?'تم حفظ التعديلات':'تم حفظ الطلب');
    const savedId = editing ? editing.id : orderData.id;
    editingOrderId=null; orderSubTab='list'; render();
    // الطباعة بعد اكتمال الحفظ والعرض
    if(printMode==='school') setTimeout(()=>printOrderSchoolCopy(savedId), 150);
    else if(printMode==='admin') setTimeout(()=>printOrderAdminCopy(savedId), 150);
  }
  document.getElementById('saveOrderBtn').onclick = ()=>doSaveOrder(null);
  document.getElementById('saveOrderPrintBtn').onclick = ()=>doSaveOrder('school');
  document.getElementById('saveOrderPrintAdminBtn').onclick = ()=>doSaveOrder('admin');
}

/* Normalizes a school name for duplicate comparison: trims, collapses spaces, ignores case */
function normalizeSchoolName(s){ return (s||'').toString().trim().replace(/\s+/g,' ').toLowerCase(); }
function findDuplicateSchool(name){
  const n = normalizeSchoolName(name);
  if(!n) return null;
  return state.schools.find(s=>{
    const sn = normalizeSchoolName(s.name);
    return sn===n || sn.includes(n) || n.includes(sn);
  }) || null;
}
function quickAddSchool(presetLevel){
  openModal('إضافة مدرسة / جهة جديدة', [
    {name:'name', label:'اسم المدرسة / الجهة', required:true},
    {name:'level', label:'المرحلة الدراسية', type:'select', options:LOCATION_TYPES.map(t=>({value:t,label:t}))},
    {name:'email', label:'البريد الإلكتروني (اختياري)'},
  ], async v=>{
    const dup = findDuplicateSchool(v.name);
    if(dup){
      // الاسم المتشابه قد يكون جهة مختلفة فعلًا (فرع/منطقة أخرى) — نسمح بالإضافة بعد تأكيد صريح
      const exact = normalizeSchoolName(dup.name)===normalizeSchoolName(v.name);
      const ok = confirm(
        (exact ? `⚠️ توجد جهة بنفس الاسم تمامًا:\n"${dup.name}"`
               : `⚠️ توجد جهة باسم مشابه:\n"${dup.name}"\n\nقد تكون جهة مختلفة (فرع أو منطقة أخرى).`)
        + `\n\nهل تريد إضافة "${v.name}" كجهة مستقلة على أي حال؟`);
      if(!ok) return false;
    }
    const item={id:uid(), name:v.name, level:v.level, email:v.email||'', supervisors:[]};
    state.schools.push(item); await saveState(); render();
    setTimeout(()=>{ const s=document.getElementById('f_school'); if(s){ s.value=item.id; s.dispatchEvent(new Event('change')); } },0);
    promptAddSupervisorFor(item.id, item.name);
  });
  if(presetLevel){ const sel=document.getElementById('mf_level'); if(sel) sel.value=presetLevel; }
}

/* ============ Print system (Duroob-style: self-contained popup document) ============ */
const PRINT_THEME = '#12335c';
const PRINT_LINE_COLOR = '#8A1538'; // عنابي — يُستخدم لإطارات وخطوط الجداول في كل التقارير
function doPrintDoc(htmlStr, landscape, pageSize, fileName){
  pageSize = pageSize || 'A4';
  const pCSS = '@page{size:'+pageSize+' '+(landscape?'landscape':'portrait')+';margin:5mm}';
  const orgName = (state.printHeader && state.printHeader.line1) || '';
  const toolbar = `<div class="no-print" style="position:sticky;top:0;z-index:999;background:${PRINT_THEME};display:flex;align-items:center;justify-content:space-between;padding:10px 18px;direction:rtl;font-family:'DG Trika','Tajawal',Arial;box-shadow:0 2px 8px rgba(0,0,0,.15);">
    <div style="color:#fff;font-weight:700;font-size:13pt;display:flex;align-items:center;gap:6px;">🏢 ${escapeHtml(orgName)}</div>
    <div style="display:flex;gap:10px;">
      <button onclick="window.print()" style="background:#fff;color:#161616;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:11pt;cursor:pointer;font-family:'DG Trika','Tajawal',Arial;">🖨️ طباعة</button>
      <button onclick="window.print()" style="background:#c0392b;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:11pt;cursor:pointer;font-family:'DG Trika','Tajawal',Arial;">📥 تنزيل PDF</button>
      <button onclick="window.close()" style="background:#5a6b82;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:700;font-size:11pt;cursor:pointer;font-family:'DG Trika','Tajawal',Arial;">❌ إغلاق</button>
    </div>
  </div>`;
  // اسم الملف المقترح عند "حفظ كـ PDF": يُستخدم fileName إن أُعطي (كما في أمر التكليف)،
  // وإلا يُستخرج تلقائيًا من عنوان التقرير نفسه (title-ar) في كل التقارير الأخرى
  let derivedTitle = fileName;
  if(!derivedTitle){
    const m = htmlStr.match(/class="title-ar">([^<]*)</);
    if(m) derivedTitle = m[1];
  }
  const titleTag = derivedTitle ? `<title>${escapeHtml(derivedTitle)}</title>` : '';
  const printCss = titleTag+'<style>'+pCSS+'@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.no-print{display:none !important;}}</style>';
  let full = htmlStr.replace('</head>', printCss+'</head>');
  full = full.replace('<body><div class="doc">', '<body>'+toolbar+'<div class="doc">');
  const blob = new Blob([full], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(!w){ toast('يرجى السماح بالنوافذ المنبثقة في المتصفح ثم إعادة المحاولة'); return; }
  w.addEventListener('load', function(){ w.focus(); setTimeout(function(){ URL.revokeObjectURL(url); }, 15000); });
}

function printDocOpen(theme){
  theme = theme || PRINT_THEME;
  return `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  ${PRINT_FONT_FACE}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DG Trika','Tajawal',Arial;direction:rtl;background:#f5f7fa;padding:10mm;color:#222;font-size:12pt;font-weight:400}
  .doc-heading-font{font-family:'DG Trika','Tajawal',Arial;font-weight:700;}
  .doc{width:100%;max-width:100%;margin:0 auto;padding:6mm 10mm;border:1.2px solid ${PRINT_LINE_COLOR};border-radius:6px;background:#fff;box-sizing:border-box;box-shadow:0 2px 6px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.08)}
  .hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid ${theme};padding-bottom:2.5mm;margin-bottom:2.5mm;direction:ltr}
  .org-right{text-align:center;direction:rtl;line-height:1.45;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .org-l1{font-size:14pt;font-weight:700;color:${PRINT_LINE_COLOR};font-family:'DG Trika','Tajawal',Arial;line-height:1.3;margin:0 0 0.6mm;text-align:center;white-space:nowrap;}
  .org-l2,.org-l3{font-size:9.5pt;color:${PRINT_LINE_COLOR};font-weight:400;line-height:1.35;margin:0;text-align:center;white-space:nowrap;}
  .logo-ph{font-size:34px}
  .title-blk{text-align:center;margin-bottom:6mm;border:2px solid ${theme};border-radius:8px;padding:5mm;background:${theme}0d}
  .title-ar{font-size:19pt;font-weight:700;color:${theme};font-family:'DG Trika','Tajawal',Arial;letter-spacing:.3px;}
  .title-sub{font-size:10.5pt;color:#555;margin-top:2mm;font-weight:700}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:6mm}
  .kpi{border:1.5px solid ${theme};border-radius:6px;padding:7px;text-align:center}
  .kpi-v{font-size:15pt;font-weight:700;color:${theme}}
  .kpi-l{font-size:9.5pt;color:#666;margin-top:2px}
  .sec-t{font-size:12pt;font-weight:700;margin:2.5mm 0 1.5mm;border-right:5px solid ${theme};padding-right:8px;color:${theme};font-family:'DG Trika','Tajawal',Arial;}
  table{width:100%;border-collapse:collapse;font-size:11pt;margin-bottom:4mm}
  thead{display:table-header-group}
  tfoot{display:table-footer-group}
  th{background:${theme};color:#fff;padding:5px 7px;border:1px solid ${PRINT_LINE_COLOR};text-align:center;vertical-align:middle;font-weight:700;font-size:9.5pt}
  td{padding:5px 7px;border:1px solid ${PRINT_LINE_COLOR};text-align:center;vertical-align:middle;font-weight:400;font-size:9.5pt}
  td.num, th.num{text-align:center}
  tr:nth-child(even) td{background:#f8fafc}
  tfoot td{background:#f0f4f8;font-weight:700}
  /* خط فاصل رفيع جدًا: شرطات دقيقة بفواصل واسعة وشفافية منخفضة —
     يُرسم كخلفية متدرجة بدل border ليمكن التحكم في سمك الشرطة وطولها بدقة */
  .field-row{display:flex;justify-content:space-between;align-items:center;border-bottom:none;
    background-image:repeating-linear-gradient(to right, rgba(138,21,56,.30) 0 1px, transparent 1px 5px);
    background-position:left bottom;background-size:100% 0.6px;background-repeat:no-repeat;
    padding:1.1mm 0;font-size:11.5pt;line-height:1.25}
  .f-ar{font-weight:700;color:${theme};min-width:150px;font-size:10.5pt}
  .f-val{flex:1;text-align:center;font-weight:400;font-size:10.5pt}
  .ftr{border-top:2px solid ${theme};margin-top:5mm;padding-top:2mm;text-align:center;font-size:9.5pt;color:#666}
  /* @page rule is injected per-call by doPrintDoc() below, with the correct size+orientation+margin */
  .field-row{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media print{
    body{background:#fff;padding:0}
    .doc{margin:0;border:1.2px solid ${PRINT_LINE_COLOR};border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
    @page{ @bottom-center{ content:"صفحة " counter(page) " من " counter(pages); font-size:8pt; color:#888; } }
  }
  </style></head><body><div class="doc">`;
}

function printDocFooter(){
  const ph = state.printHeader || {};

  return `<div class="ftr">${escapeHtml(ph.line1||'')} — ${escapeHtml(ph.line2||'')} — تمت الطباعة بتاريخ ${fmtDate(todayStr())} الساعة ${timeStr}</div>`;

/* Trainer name+phone: same style and same color for both boxes, uniform width across multiple trainers */
function trainerMiniTable(o){
  const ids = (o&&o.trainerIds)||[];
  const list = ids.map(id=>state.trainers.find(t=>t.id===id)).filter(Boolean);
  if(!list.length) return '—';
  return list.map(t=>`<div style="display:flex;align-items:center;gap:6px;margin:3px 2px;">
      <span style="font-weight:700;font-size:10pt;color:#17497A;">${escapeHtml(t.name)}</span>
      <span style="font-size:9pt;color:#555;">${t.phone?phoneLink(t.phone):'-'}</span>
    </div>`).join('');
}
/* عدد الأيام بين تاريخين (شامل يوم البداية والنهاية) */
function daysCount(dateFrom, dateTo){
  if(!dateFrom) return 0;
  if(!dateTo || dateTo===dateFrom) return 1;
  const d1 = new Date(dateFrom+'T00:00:00'), d2 = new Date(dateTo+'T00:00:00');
  const diff = Math.round((d2-d1)/86400000)+1;
  return diff>0 ? diff : 1;
}
/* المدة بالساعات بين وقتين (يدعم دورانها بعد منتصف الليل) */
function hoursDuration(timeFrom, timeTo, dateFrom, dateTo){
  if(!timeFrom || !timeTo) return 0;
  const [h1,m1] = timeFrom.split(':').map(Number), [h2,m2] = timeTo.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins<0) mins += 24*60;
  const perDayHours = mins/60;
  const days = dateFrom ? daysCount(dateFrom, dateTo) : 1;
  return Math.round(perDayHours*days*100)/100;
}
function fullTimeRange(from, to){
  if(!from && !to) return '';
  if(from && to) return `من الساعة ${from} إلى الساعة ${to}`;
  return from ? `من الساعة ${from}` : `إلى الساعة ${to}`;
}
/* عرض التاريخ بصيغة DD-MM-YYYY (للعرض فقط — التخزين يبقى YYYY-MM-DD لضمان صحة الفرز والمقارنات) */
/* نطاق تاريخ الفعالية: من تاريخ المبادرة إلى تاريخ الانتهاء (يعرض تاريخًا واحدًا لو كانت ليوم واحد) */
/* مقدم الفعالية: الاسم في سطر ممتد ورقم الهاتف أسفله داخل نفس الخانة */
function trainerCell(o){
  const list=(o.trainerIds||[]).map(id=>state.trainers.find(t=>t.id===id)).filter(Boolean);
  if(!list.length) return '—';
  return list.map(t=>`<div style="line-height:1.35;margin:2px 0;"><div style="font-weight:700;">${escapeHtml(t.name)}</div>${t.phone?`<div style="font-size:9pt;color:#666;">${escapeHtml(t.phone)}</div>`:''}</div>`).join('');
}
function trainerCellText(o){
  const list=(o.trainerIds||[]).map(id=>state.trainers.find(t=>t.id===id)).filter(Boolean);
  return list.map(t=>t.phone?`${t.name} (${t.phone})`:t.name).join(' / ');
}
function dateRangeStr(o){
  const s = o && o.date ? fmtDate(o.date) : '';
  const e = o && o.dateTo && o.dateTo !== o.date ? fmtDate(o.dateTo) : '';
  if(!s && !e) return '';
  return e ? `${s} — ${e}` : s;
}
function fmtDate(dateStr){
  if(!dateStr) return '';
  const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : dateStr;
}
function fullDateStr(dateStr){
  if(!dateStr) return '';
  try{
    const d = new Date(dateStr+'T00:00:00');
    const weekday = d.toLocaleDateString('ar-QA-u-nu-latn', {weekday:'long'});
    return `${weekday}، ${fmtDate(dateStr)}`;
  }catch(e){ return fmtDate(dateStr); }
}

/* ---- single-document (order) print: field-row style ---- */
async function generateQRDataUrl(text){
  try{
    if(typeof QRCode==='undefined') return '';
    return await QRCode.toDataURL(text, {width:220, margin:1, color:{dark:'#000000', light:'#ffffff'}});
  }catch(e){ console.error('QR generation error', e); return ''; }
}
/* Real 1D (linear) barcode — CODE128 — encoding the assignment order serial number */
function generateBarcodeDataUrl(text){
  try{
    if(typeof JsBarcode==='undefined') return '';
    const canvas = document.createElement('canvas');
    JsBarcode(canvas, text, {format:'CODE128', displayValue:false, margin:2, height:44, width:5, lineColor:PRINT_LINE_COLOR});
    return canvas.toDataURL('image/png');
  }catch(e){ console.error('Barcode generation error', e); return ''; }
}

/* يعرض الطلبات الإدارية المختارة لفعالية كجدول بثلاثة أعمدة: إداري، إعلامي، ضيافة */
function adminRequestsTable(order){
  const selectedIds = order.adminRequests||[];
  const categories = ['إداري','إعلامي','ضيافة'];
  const byCat = categories.map(cat=>({
    cat,
    items: state.adminRequestsList.filter(r=>(r.category||'إداري')===cat && selectedIds.includes(r.id))
  }));
  if(byCat.every(c=>c.items.length===0)) return '—';
  const maxRows = Math.max(...byCat.map(c=>c.items.length));
  let rowsHtml = '';
  for(let i=0;i<maxRows;i++){
    rowsHtml += `<tr>${byCat.map(c=>`<td style="border:1px solid ${PRINT_LINE_COLOR};padding:4px 10px;text-align:center;">${c.items[i]?escapeHtml(c.items[i].name):''}</td>`).join('')}</tr>`;
  }
  const fontFamily = "'DG Trika','Tajawal',sans-serif";
  return `<table style="width:100%;border-collapse:collapse;font-family:${fontFamily};"><thead><tr>${categories.map(cat=>`<th style="border:1px solid ${PRINT_LINE_COLOR};background:${PRINT_LINE_COLOR};color:#fff;padding:5px 10px;font-size:9.5pt;font-weight:700;text-align:center;font-family:${fontFamily};">${cat}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
}

/* ---- shared multi-record report doc builder (KPI row + one colored table, Duroob style) ---- */
function buildReportDoc(opts){
  // opts: {titleAr, subtitle, kpis:[{v,l}], headers:[...], rows:[[...]], theme}
  const theme = opts.theme || PRINT_THEME;
  let html = printDocOpen(theme);
  html += printDocHeaderBlock();
  html += `<div class="title-blk"><div class="title-ar">${escapeHtml(opts.titleAr)}</div><div class="title-sub">${escapeHtml(opts.subtitle||'')}</div></div>`;
  if(opts.kpis && opts.kpis.length){
    html += `<div class="kpi-row">${opts.kpis.map(k=>`<div class="kpi"><div class="kpi-v">${escapeHtml(String(k.v))}</div><div class="kpi-l">${escapeHtml(k.l)}</div></div>`).join('')}</div>`;
  }
  if(opts.headers && opts.rows){
    html += `<table><thead><tr>${opts.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>`;
    html += opts.rows.length ? opts.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${opts.headers.length}" style="text-align:center;color:#999;padding:16px;">لا توجد بيانات</td></tr>`;
    html += `</tbody></table>`;
  }
  if(opts.extraHtml) html += opts.extraHtml;
  html += printDocFooter();
  html += printDocClose();
  return html;
}

      headers:['م','أمر التكليف','عنوان الفعالية','التاريخ','المدة','الوقت','المكان','رقم المشرف','عدد المشاركين','مقدم البرنامج','الطلبات الإدارية للبرنامج'],

  document.getElementById('arq_range').addEventListener('change', (e)=>{
    document.getElementById('arq_toWrap').style.display = e.target.value ? 'none' : '';
  });

  function getList(){
    const range = document.getElementById('arq_range').value;
    const fromInput = document.getElementById('arq_from').value;
    let from = fromInput, to = document.getElementById('arq_to').value;
    if(range && fromInput){
      const d = new Date(fromInput+'T00:00:00');
      if(range==='week') d.setDate(d.getDate()+6);
      else if(range==='month') d.setMonth(d.getMonth()+1), d.setDate(d.getDate()-1);
      to = d.toISOString().slice(0,10);
    }
    const list = state.orders.filter(o=> (o.adminRequests||[]).length>0 && (!from||o.date>=from) && (!to||o.date<=to))
      .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || a.serial-b.serial);
    return {list, from, to};
  }
  function rowsOf(list){
    const rows = [];
    list.forEach(o=>{
      const school = state.schools.find(s=>s.id===o.schoolId);
      const dateStr = o.dateTo && o.dateTo!==o.date ? `${fmtDate(o.date)} — ${fmtDate(o.dateTo)}` : fmtDate(o.date);
      const reqNames = (o.adminRequests||[]).map(id=>{ const r=state.adminRequestsList.find(x=>x.id===id); return r?r.name:''; }).filter(Boolean);
      reqNames.forEach(reqName=>{
        rows.push({o, school, dateStr, reqName});
      });
    });
    return rows;

  function draw(){
    const {list} = getList();
    const rows = rowsOf(list);
    const box = document.getElementById('arq_result');
    box.innerHTML = `<h2>النتائج (${rows.length})</h2>

        ${rows.map(r=>`<tr><td><input type="checkbox" class="arq-check" data-id="${r.o.id}"></td><td>${r.o.serial}</td><td>${escapeHtml(r.dateStr)}</td><td>${daysCount(r.o.date,r.o.dateTo)}</td><td>${hoursDuration(r.o.timeFrom,r.o.timeTo,r.o.date,r.o.dateTo)}</td><td>${r.school?escapeHtml(r.school.name):''}</td><td>${escapeHtml(trainerNames(r.o))}</td><td>${escapeHtml(trainerPhones(r.o))}</td><td>${escapeHtml(r.reqName)}</td></tr>`).join('') || '<tr><td colspan="9" class="empty-state">لا توجد طلبات إدارية ضمن هذه الفترة</td></tr>'}
      </tbody></table>`;
    enhanceReportTable(box);

  function selectedRows(){
    const ids = Array.from(document.querySelectorAll('.arq-check:checked')).map(cb=>cb.dataset.id);

    return rowsOf(list.filter(o=>ids.includes(o.id)));
  }
  function excelRowsOf(rows){
    return rows.map(r=>[r.o.serial, r.dateStr, daysCount(r.o.date,r.o.dateTo), hoursDuration(r.o.timeFrom,r.o.timeTo,r.o.date,r.o.dateTo), r.school?r.school.name:'', trainerNames(r.o), trainerPhones(r.o), r.reqName]);
  }
  const excelHeaders = ['رقم التكليف','تاريخ المبادرة','عدد الأيام','عدد الساعات','المكان','مقدم المبادرة','الهاتف','الطلب'];

  document.getElementById('arq_excel').onclick=()=>{
    const {list, from, to} = getList();
    exportToExcel('الطلبات_الإدارية.xlsx', excelHeaders, excelRowsOf(rowsOf(list)), `تقرير الطلبات الإدارية (من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'})`);
  };
  document.getElementById('arq_excelSel').onclick=()=>{
    const rows = selectedRows();
    if(!rows.length){ toast('يرجى تحديد فعالية واحدة على الأقل'); return; }
    exportToExcel('الطلبات_الإدارية_محدد.xlsx', excelHeaders, excelRowsOf(rows), 'الطلبات الإدارية — فعاليات محددة');
  };

  function buildPrintRows(rows){
    return rows.map(r=>[r.o.serial, escapeHtml(r.dateStr), daysCount(r.o.date,r.o.dateTo), hoursDuration(r.o.timeFrom,r.o.timeTo,r.o.date,r.o.dateTo), r.school?escapeHtml(r.school.name):'', escapeHtml(trainerNames(r.o)), escapeHtml(trainerPhones(r.o)), escapeHtml(r.reqName)]);
  }
  async function printIt(){
    const {list, from, to} = getList();
    doPrintDoc(buildReportDoc({
      titleAr:'تقرير الطلبات الإدارية', subtitle:`من ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'}`,
      kpis:[{v:list.length,l:'عدد الفعاليات'}],
      headers:excelHeaders,
      rows: buildPrintRows(rowsOf(list))
    }), true, 'A4');
  }
  async function printSelected(){
    const rows = selectedRows();
    if(!rows.length){ toast('يرجى تحديد فعالية واحدة على الأقل'); return; }
    doPrintDoc(buildReportDoc({
      titleAr:'الطلبات الإدارية — فعاليات محددة', subtitle:`عدد الفعاليات المحددة: ${rows.length}`,
      headers:excelHeaders,
      rows: buildPrintRows(rows)
    }), true, 'A4');
  }
  document.getElementById('arq_print').onclick=printIt;
  document.getElementById('arq_pdf').onclick=printIt;
  document.getElementById('arq_printSel').onclick=printSelected;
  document.getElementById('arq_pdfSel').onclick=printSelected;
  draw();
}

      </select></div>
      <div class="field"><label>الشهر</label><input id="qa_month" type="month" lang="en-GB" value="${editing?editing.month:''}"></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="field"><label>من تاريخ</label><input id="qa_from" type="date" lang="en-GB" value="${editing?editing.dateFrom:''}"></div>
      <div class="field"><label>إلى تاريخ</label><input id="qa_to" type="date" lang="en-GB" value="${editing?editing.dateTo:''}"></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="field"><label>عدد أيام تنفيذ البرنامج</label><input id="qa_days" type="number" lang="en" min="0" value="${editing?editing.execDays:''}"></div>
      <div class="field"><label>آلية التسميع</label><select id="qa_method">
        <option value="حضوري" ${editing&&editing.method==='حضوري'?'selected':''}>حضوري</option>
        <option value="عن بُعد" ${editing&&editing.method==='عن بُعد'?'selected':''}>عن بُعد</option>
      </select></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="field"><label>عدد المعلمين</label><input id="qa_teachers" type="number" lang="en" min="0" value="${editing?editing.teachersCount:''}"></div>
      <div class="field"><label>عدد الطلاب</label><input id="qa_students" type="number" lang="en" min="0" value="${editing?editing.studentsCount:''}"></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="field"><label>عدد صفحات الحفظ</label><input id="qa_memPages" type="number" lang="en" min="0" value="${editing?editing.memPages:''}"></div>
      <div class="field"><label>عدد الأجزاء المحفوظة (تلقائي: كل 20 صفحة = جزء)</label><input id="qa_memParts" type="number" lang="en" min="0" value="${editing?editing.memParts:0}" readonly style="background:#F3F8FC;"></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="field"><label>عدد صفحات المراجعة</label><input id="qa_revPages" type="number" lang="en" min="0" value="${editing?editing.revPages:''}"></div>
      <div class="field"><label>عدد الأجزاء التي تمت مراجعتها (تلقائي: كل 20 صفحة = جزء)</label><input id="qa_revParts" type="number" lang="en" min="0" value="${editing?editing.revParts:0}" readonly style="background:#F3F8FC;"></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="field"><label>المنجز (تلقائي: مجموع الأجزاء المحفوظة + الأجزاء المراجعة)</label><input id="qa_achieved" type="number" lang="en" value="${editing?((editing.memParts||0)+(editing.revParts||0)):0}" readonly style="background:#F3F8FC;"></div>
      <div class="field"><label>المستهدف الشهري (عدد الأجزاء)</label><input id="qa_target" type="number" lang="en" min="0" step="0.25" value="${editing?editing.monthlyTarget||'':''}"></div>
    </div>
    <div class="grid" style="grid-template-columns:1fr;">
      <div class="field"><label>نسبة الإنجاز الشهري (%) — تلقائي = (المنجز ÷ المستهدف) × 100</label><input id="qa_pct" type="number" lang="en" value="${editing?editing.completionPct:0}" readonly style="background:#F3F8FC;"></div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-primary" id="qa_save">${editing?'حفظ التعديلات':'حفظ البيانات'}</button>
      ${editing?'<button class="btn btn-outline" id="qa_cancelEdit">إلغاء التعديل</button>':''}
    </div>
  </div>`;

  const defaultTargets = {'الرحيق':5, 'روح':450};
  document.getElementById('qa_program').addEventListener('change', (e)=>{
    const t = document.getElementById('qa_target');
    if(!t.value) t.value = defaultTargets[e.target.value] || '';
    recalc();
  });
  if(!editing){
    const t = document.getElementById('qa_target');
    if(!t.value) t.value = defaultTargets[document.getElementById('qa_program').value] || '';
  }

  function partsFromPages(pages){
    // كل 20 صفحة = جزء، مع احتساب حتى الربع والنصف جزء (تقريب لأقرب 0.25)
    return Math.round((pages/20)*4)/4;
  }
  function recalc(){
    const memPages = Number(document.getElementById('qa_memPages').value)||0;
    const revPages = Number(document.getElementById('qa_revPages').value)||0;
    const target = Number(document.getElementById('qa_target').value)||0;
    const memParts = partsFromPages(memPages);
    const revParts = partsFromPages(revPages);
    document.getElementById('qa_memParts').value = String(memParts);
    document.getElementById('qa_revParts').value = String(revParts);
    const achieved = memParts + revParts;
    document.getElementById('qa_achieved').value = String(achieved);
    const pct = target>0 ? Math.round((achieved/target)*1000)/10 : 0;
    document.getElementById('qa_pct').value = String(pct);
  }
  ['qa_memPages','qa_revPages','qa_target'].forEach(id=>document.getElementById(id).addEventListener('input', recalc));
  recalc();

  if(editing) document.getElementById('qa_cancelEdit').onclick=()=>{editingQuranId=null; render();};

  document.getElementById('qa_save').onclick=async ()=>{
    const programName=document.getElementById('qa_program').value;
    const month=document.getElementById('qa_month').value;
    if(!month){ toast('يرجى تحديد الشهر'); return; }
    recalc();
    const data = {
      programName, month,
      dateFrom:document.getElementById('qa_from').value,
      dateTo:document.getElementById('qa_to').value,
      execDays:Number(document.getElementById('qa_days').value)||0,
      method:document.getElementById('qa_method').value,
      teachersCount:Number(document.getElementById('qa_teachers').value)||0,
      studentsCount:Number(document.getElementById('qa_students').value)||0,
      memPages:Number(document.getElementById('qa_memPages').value)||0,
      memParts:Number(document.getElementById('qa_memParts').value)||0,
      revPages:Number(document.getElementById('qa_revPages').value)||0,
      revParts:Number(document.getElementById('qa_revParts').value)||0,
      monthlyTarget:Number(document.getElementById('qa_target').value)||0,
      completionPct:Number(document.getElementById('qa_pct').value)||0,
    };
    if(editing){
      Object.assign(editing, data);
      await saveState(); toast('تم حفظ التعديلات'); editingQuranId=null; render();
      return;
    }
    const dup = state.quranActivities.find(x=>x.programName===programName && x.month===month);
    if(dup){
      const ok = confirm(`يوجد سجل مسبق لبرنامج "${programName}" لشهر ${month}. هل تريد استبدال بياناته؟`);
      if(!ok) return;
      Object.assign(dup, data);
      await saveState(); toast('تم تحديث السجل الموجود'); render();
      return;
    }
    state.quranActivities.push({id:uid(), ...data, createdAt:Date.now()});
    await saveState(); toast('تم حفظ البيانات'); render();
  };
}

function renderQuranReportTab(sub){

          const e = x.dateTo || x.dateFrom || '';
          if(!s && !e) return false;
          if(dFrom && e && e < dFrom) return false;
          if(dTo && s && s > dTo) return false;
        }
        return true;
      })
      .sort((a,b)=> a.month.localeCompare(b.month) || a.programName.localeCompare(b.programName));
  }
  function totalsOf(list){
    const t = list.reduce((t,x)=>({
      memPages:t.memPages+x.memPages, memParts:t.memParts+x.memParts,
      revPages:t.revPages+x.revPages, revParts:t.revParts+x.revParts,
      execDays:t.execDays+x.execDays, pctSum:t.pctSum+x.completionPct
    }), {memPages:0,memParts:0,revPages:0,revParts:0,execDays:0,pctSum:0});

    /* المعلمون والطلاب أشخاص يتكررون كل شهر، فجمعهم شهريًا يضاعف نفس الأشخاص.
       نحتسب بدلاً من ذلك أعلى عدد سُجّل لكل برنامج خلال الفترة (يمثّل حجم المجموعة
       الفعلي دون تأثّر بغياب شهر معيّن)، ثم نجمع البرامج المختلفة معًا. */
    const maxByProgram = {};
    list.forEach(x=>{
      const p = x.programName || '';
      if(!maxByProgram[p]) maxByProgram[p] = {teachers:0, students:0};
      maxByProgram[p].teachers = Math.max(maxByProgram[p].teachers, x.teachersCount||0);
      maxByProgram[p].students = Math.max(maxByProgram[p].students, x.studentsCount||0);
    });
    t.teachersCount = Object.values(maxByProgram).reduce((s,v)=>s+v.teachers, 0);
    t.studentsCount = Object.values(maxByProgram).reduce((s,v)=>s+v.students, 0);
    return t;
  }
  function draw(){
    const list = getList();
    const t = totalsOf(list);
    const avgPct = list.length ? (t.pctSum/list.length).toFixed(1) : '0';
    const box = document.getElementById('qr_result');
    box.innerHTML = `<h2>النتائج (${list.length})</h2>
      <table><thead><tr><th>اسم البرنامج</th><th>الشهر</th><th>الفترة</th><th>أيام التنفيذ</th><th>آلية التسميع</th><th>المعلمين</th><th>الطلاب</th><th>صفحات الحفظ</th><th>الأجزاء المحفوظة</th><th>صفحات المراجعة</th><th>الأجزاء المراجعة</th><th>نسبة الإنجاز %</th>${currentRole==='admin'?'<th>إجراءات</th>':''}</tr></thead><tbody>
        ${list.map(x=>`<tr><td>${escapeHtml(x.programName)}</td><td>${monthNameAr(x.month)}</td><td>${fmtDate(x.dateFrom)} — ${fmtDate(x.dateTo)}</td><td>${x.execDays}</td><td>${escapeHtml(x.method)}</td><td>${x.teachersCount}</td><td>${x.studentsCount}</td><td>${x.memPages}</td><td>${x.memParts}</td><td>${x.revPages}</td><td>${x.revParts}</td><td>${x.completionPct}%</td>${currentRole==='admin'?`<td><button class="icon-btn" title="تعديل" onclick="editQuranRecord('${x.id}')">✏️</button> <button class="icon-btn" title="حذف" onclick="deleteQuranRecord('${x.id}')">🗑️</button></td>`:''}</tr>`).join('') || `<tr><td colspan="13" class="empty-state">لا توجد سجلات مطابقة</td></tr>`}
      </tbody>
      ${list.length?`<tfoot><tr style="font-weight:700;background:#F3F8FC;"><td colspan="3">الإجمالي</td><td>${t.execDays}</td><td></td><td>${t.teachersCount}</td><td>${t.studentsCount}</td><td>${t.memPages}</td><td>${t.memParts}</td><td>${t.revPages}</td><td>${t.revParts}</td><td>${avgPct}%</td>${currentRole==='admin'?'<td></td>':''}</tr></tfoot>`:''}
      </table>`;
    enhanceReportTable(box);
  }
  document.getElementById('qr_go').onclick=draw;

  function periodLabel(){
    const m=document.getElementById('qr_month').value;
    const f=document.getElementById('qr_from').value, t=document.getElementById('qr_to').value;
    const df=document.getElementById('qr_dFrom').value, dt=document.getElementById('qr_dTo').value;
    if(df||dt) return `من ${df?fmtDate(df):'البداية'} إلى ${dt?fmtDate(dt):'النهاية'}`;
    if(m) return monthNameAr(m);
    if(f||t) return `من ${f?monthOnlyAr(f):'البداية'} إلى ${t?monthOnlyAr(t):'النهاية'}`;
    return 'كل الأشهر';
  }
  document.getElementById('qr_excel').onclick=()=>{
    const list=getList();
    const rows=list.map(x=>[x.programName,monthNameAr(x.month),fmtDate(x.dateFrom),fmtDate(x.dateTo),x.execDays,x.method,x.teachersCount,x.studentsCount,x.memPages,x.memParts,x.revPages,x.revParts,x.completionPct]);
    exportToExcel('تقرير_الأنشطة_القرآنية.xlsx', ['اسم البرنامج','الشهر','من','إلى','أيام التنفيذ','آلية التسميع','المعلمين','الطلاب','صفحات الحفظ','الأجزاء المحفوظة','صفحات المراجعة','الأجزاء المراجعة','نسبة الإنجاز %'], rows, `تقرير الأنشطة القرآنية (${periodLabel()})`);
  };
  function printIt(){
    const list=getList();
    const t=totalsOf(list);
    const avgPct = list.length ? (t.pctSum/list.length).toFixed(1) : '0';
    const rows=list.map(x=>[escapeHtml(x.programName),monthNameAr(x.month),`${fmtDate(x.dateFrom)} — ${fmtDate(x.dateTo)}`,x.execDays,escapeHtml(x.method),x.teachersCount,x.studentsCount,x.memPages,x.memParts,x.revPages,x.revParts,x.completionPct+'%']);
    doPrintDoc(buildReportDoc({
      titleAr:'تقرير الأنشطة القرآنية — روح والرحيق', subtitle:`${periodLabel()} — عدد السجلات: ${list.length}`,
      kpis:[{v:t.teachersCount,l:'إجمالي المعلمين'},{v:t.studentsCount,l:'إجمالي الطلاب'},{v:t.memPages,l:'إجمالي صفحات الحفظ'},{v:t.revPages,l:'إجمالي صفحات المراجعة'},{v:avgPct+'%',l:'متوسط نسبة الإنجاز'}],
      headers:['اسم البرنامج','الشهر','الفترة','أيام التنفيذ','آلية التسميع','المعلمين','الطلاب','صفحات الحفظ','الأجزاء المحفوظة','صفحات المراجعة','الأجزاء المراجعة','نسبة الإنجاز'],
      rows
    }), true, 'A4');
  }
  document.getElementById('qr_print').onclick=printIt;
  document.getElementById('qr_pdf').onclick=printIt;
  draw();
}

    function syncModeVisibility(){

      const base = [o.serial, o.title, dateRangeStr(o), fullTimeRange(o.timeFrom,o.timeTo), school?school.name:'', supervisor?supervisor.phone||'':'', trainerCellText(o)];

        if(c==='مجال المبادرة'){ const f=state.fields.find(x=>x.id===o.fieldId); return f?f.name:''; }
        return '';
      });

/* ============ Simple SVG bar chart ============ */
function svgBarChart(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  const barH=22, gap=10, maxW=320;
  const height = items.length*(barH+gap);
  const bars = items.map((it,i)=>{
    const w = Math.max(2, Math.round((it.value/max)*maxW));
    const y = i*(barH+gap);
    return `<rect x="0" y="${y}" width="${w}" height="${barH}" rx="4" fill="#7a1230"></rect>
      <text x="${maxW+10}" y="${y+barH*0.72}" font-size="12" fill="#2a1116">${escapeHtml(it.name)} (${it.value})</text>`;
  }).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${maxW+180} ${height+10}" style="width:100%;max-width:560px;height:auto;">${bars}</svg></div>`;
}
const DONUT_COLORS = ['#8A1538','#C8A951','#1d5e86','#1e6b34','#a83c5b','#6d0f2b','#8a6470','#c0273f'];
function svgDonutChart(items){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  const cx=90, cy=90, r=70, sw=32;
  let angle=-90;
  const circumference = 2*Math.PI*r;
  const arcs = items.map((it,i)=>{
    const frac = it.value/total;
    const dash = frac*circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${DONUT_COLORS[i%DONUT_COLORS.length]}" stroke-width="${sw}"
      stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-angle/360*circumference}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    angle += frac*360;
    return el;
  }).join('');
  const legend = items.map((it,i)=>`<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:4px;">
    <span style="width:12px;height:12px;border-radius:3px;background:${DONUT_COLORS[i%DONUT_COLORS.length]};display:inline-block;"></span>
    ${escapeHtml(it.name)} — ${it.value} (${total?Math.round(it.value/total*100):0}%)</div>`).join('');
  return `<div class="chart-wrap" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center;">
    <svg width="180" height="180" viewBox="0 0 180 180">${arcs}<text x="90" y="96" text-anchor="middle" font-size="18" font-weight="800" fill="#2a1116">${total}</text></svg>
    <div>${legend}</div>
  </div>`;
}

    });
    if(trainerId){
      state.notifications.push({id:uid(), trainerId, message:`مهمة جديدة مسندة إليك: "${title}"${due?(' — الاستحقاق: '+due):''}`, read:false, createdAt:Date.now()});
    }
    await saveState(); toast('تمت إضافة المهمة'); render();
  };
  drawList();
}
async function updateTaskStatus(id, status){ const t=state.tasks.find(x=>x.id===id); if(t){ t.status=status; t.done=(status==='مكتملة'); await saveState(); render(); } }
async function toggleTask(id){ const t=state.tasks.find(x=>x.id===id); if(t){ t.done=!t.done; t.status=t.done?'مكتملة':'لم تبدأ'; await saveState(); render(); } }
async function deleteTask(id){ state.tasks = state.tasks.filter(x=>x.id!==id); await saveState(); render(); }

/* ---- reminders & motivational popups for the logged-in trainer ---- */
function daysDiff(from, to){ if(!from||!to) return null; return Math.round((new Date(to+'T00:00:00') - new Date(from+'T00:00:00'))/86400000); }
function isoWeekKey(d){ const dt=new Date(d); const onejan=new Date(dt.getFullYear(),0,1); const week=Math.ceil((((dt-onejan)/86400000)+onejan.getDay()+1)/7); return dt.getFullYear()+'-W'+week; }
async function checkAndShowTrainerPopups(trainer, myOrders){
  if(!trainer) return;
  const today = todayStr();
  const now = new Date();
  let changed=false;
  const flags = state.reminderFlags;

  for(const o of myOrders){
    if(daysDiff(today,o.date)===1){
      const key='dayBefore_'+o.id;
      if(!flags[key]){
        flags[key]=true; changed=true;
        openAnnouncement('🔔 تذكير بفعالية غدًا', `لديك فعالية غدًا "${o.title}" في ${o.date} الساعة ${o.timeFrom||''}. الرجاء التجهيز لها.`);
        break;
      }
    }
  }
  // same-day: 2 hours after the event's end time, if not yet evaluated
  for(const o of myOrders){
    if(o.date===today && o.timeTo && !o.completionStatus){
      const end = parseDT(o.date, o.timeTo);
      if(end && (now - end) >= 2*60*60*1000){
        const key='2hAfter_'+o.id;
        if(!flags[key]){
          flags[key]=true; changed=true;
          openAnnouncement('📝 قيّم الفعالية', `مرّ أكثر من ساعتين على انتهاء فعالية "${o.title}". الرجاء تسجيل الإنجاز والتقييم الآن.`);
          break;
        }
      }
    }
  }
  for(const o of myOrders){
    if(o.date && o.date<today && !o.completionStatus){
      const key='postEvent_'+o.id;
      if(!flags[key]){
        flags[key]=true; changed=true;
        openAnnouncement('📝 حان وقت التقييم', `فعالية "${o.title}" بتاريخ ${o.date} انتهت. الرجاء تسجيل الإنجاز والتقييم الآن.`);
        break;
      }
    }
  }
  // newly assigned tasks
  const myTasksForPopup = state.tasks.filter(t=>t.trainerId===trainer.id);
  for(const t of myTasksForPopup){
    const key='taskAssigned_'+t.id;
    if(!flags[key]){
      flags[key]=true; changed=true;
      openAnnouncement('📋 مهمة جديدة', `تم إسناد مهمة جديدة إليك: "${t.title}"${t.due?(' — الاستحقاق: '+t.due):''}.`);
      break;
    }
  }
  if(now.getDay()===4){
    const wk = isoWeekKey(now);
    const key='motivation_'+trainer.id+'_'+wk;
    if(!flags[key]){
      flags[key]=true; changed=true;
      openAnnouncement('💐 رسالة تحفيزية', 'نشكر لك جهودك المقدمة خلال الاسبوع السابق ونأمل الإطلاع على فعاليات خلال الأسبوع القادم مع التجهيز لها.');
    }
  }
  if(changed) await saveState();
}

    // نرتب حسب رقم التكليف تصاعديًا حتى نُبقي أول (أقدم) نسخة من كل تكرار
    state.orders.slice().sort((a,b)=>(a.serial||0)-(b.serial||0)).forEach(o=>{
      const key = normTitle(o.title)+'|'+(o.date||'')+'|'+(o.schoolId||'');

    });
    if(!toDelete.length){ toast('لا توجد فعاليات مكررة'); return; }

    state.orders = state.orders.filter(o=>!toDelete.includes(o.id));
    await saveState(); toast(`تم حذف ${toDelete.length} فعالية مكررة`); render();
  };
